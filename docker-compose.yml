x-app: &app
  build: .
  image: searchly
  env_file:
    - path: .env
      required: false
  environment: &app-env
    DATABASE_URL: postgres://${DB_USER:-searchly}:${DB_PASSWORD:-searchly}@postgres:5432/${DB_NAME:-searchly}?sslmode=disable

services:
  postgres:
    image: postgres:16-alpine
    container_name: searchly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-searchly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-searchly}
      POSTGRES_DB: ${DB_NAME:-searchly}
    ports:
      - ${DB_PORT:-5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    command: ["/app/migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  ingest:
    <<: *app
    command: ["/app/ingest"]
    restart: unless-stopped
    environment:
      <<: *app-env
      INGEST_INTERVAL: ${INGEST_INTERVAL:-5m}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *app
    command: ["/app/searchly"]
    restart: unless-stopped
    ports:
      - ${PORT:-8080}:8080
    environment:
      <<: *app-env
      PORT: "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
