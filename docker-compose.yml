services:
  postgres:
    image: postgres:16-alpine
    container_name: searchly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: searchly
      POSTGRES_PASSWORD: searchly
      POSTGRES_DB: searchly
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U searchly -d searchly"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
